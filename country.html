<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="country.js" defer></script>
		<link
			href="https://fonts.googleapis.com/css?family=Nunito:300,regular,500,600,700,800,900"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="country.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
			integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
		<title>Country</title>
	</head>
	<body>
		<header class="header">
			<h2 class="title">Where in the world?</h2>
			<p class="dark-mode">
				<i class="fa-regular fa-moon"></i
				><span class="dark-mode">Dark Mode</span>
			</p>
		</header>
		<main>
			<span class="back-button"
				><i class="fa-solid fa-arrow-left"></i> &nbsp;&nbsp;Back</span>
			<div class="country-details">
				<div class="country-img">
					<img class="flag-image" src="" alt="no photo" />
				</div>
				<div class="country-text">
					<h1 class="country-name"></h1>
					<div class="country-text-mid">
							<p><b>Native Name:</b><span class="native-name"></span></p>
							<p><b>Population:</b><span class="population"></span></p>
							<p><b>Region:</b><span class="region"></span></p>
							<p><b>Sub Region:</b><span class="sub-region"></span></p>
							<p><b>Capital:</b><span class="capital"></span></p>
							<p><b>Top Level Domain:</b><span class="domain"></span></p>
							<p><b>Currencies:</b><span class="currencies"></span></p>
							<p><b>Languages:</b><span class="language"></span></p>
                        </div>
						<div class="border-countries">
							<b>Border Countries:</b>
						</div>
					
				</div>
			</div>
		</main>
	</body>
</html>
